<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoffeeShop AI Support</title>
    <meta
      name="description"
      content="Публичный веб-ассистент для кофейни с ответами по меню и заказам"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <p class="eyebrow">Публичный AI-помощник для кофейни</p>
        <h1>CoffeeShop AI Support</h1>
        <p class="lead">
          Теперь проект доступен как веб-приложение для любого пользователя. Можно задавать вопросы, получать быстрые ответы и использовать сервис прямо в браузере.
        </p>
      </section>

      <section class="chat-card">
        <div class="chat-header">
          <h2>Чат с помощником</h2>
          <span class="status">Онлайн</span>
        </div>
        <div id="messages" class="messages">
          <div class="message bot">Привет! Я помогу с меню, заказами и вопросами по кофейне.</div>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="message-input" type="text" placeholder="Напишите ваш вопрос..." autocomplete="off" required />
          <button type="submit">Отправить</button>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message-input');
      const messages = document.getElementById('messages');

      function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        addMessage('Подождите, я формирую ответ…', 'bot');

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await response.json();
          messages.lastChild.remove();
          addMessage(data.reply || 'Извините, не удалось получить ответ.', 'bot');
        } catch (error) {
          messages.lastChild.remove();
          addMessage('Сервис временно недоступен. Попробуйте позже.', 'bot');
        }
      });
    </script>
  </body>
</html>
