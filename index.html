<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoffeeShop AI Support</title>
    <meta
      name="description"
      content="Публичный веб-ассистент для кофейни с ответами по меню и заказам"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <section class="hero">
        <p class="eyebrow">Публичный AI-помощник для кофейни</p>
        <h1>CoffeeShop AI Support</h1>
        <p class="lead">
          Теперь проект доступен как веб-приложение для любого пользователя.
          Можно задавать вопросы, получать ответы по меню и заказам.
        </p>
      </section>

      <section class="chat-card">
        <div class="chat-header">
          <h2>Чат с помощником</h2>
          <span class="status">Онлайн</span>
        </div>

        <div id="messages" class="messages">
          <div class="message bot">
            Привет! Я помогу с меню, заказами и вопросами по кофейне.
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="Напишите ваш вопрос..."
            autocomplete="off"
            required
          />
          <button type="submit">Отправить</button>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message-input');
      const messages = document.getElementById('messages');
      const renderApi = '/api/chat';

      function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
      }

      async function sendMessage(text) {
        const response = await fetch(renderApi, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: text
          })
        });

        const rawText = await response.text();

        let data;

        try {
          data = JSON.parse(rawText);
        } catch (error) {
          throw new Error(
            `Сервер вернул некорректный ответ: ${rawText}`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error || `Ошибка сервера HTTP ${response.status}`
          );
        }

        if (!data.reply) {
          throw new Error('В ответе сервера отсутствует поле reply');
        }

        return data.reply;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const text = input.value.trim();

        if (!text) {
          return;
        }

        addMessage(text, 'user');
        input.value = '';

        const waitingMessage = addMessage(
          'Подождите, я формирую ответ…',
          'bot'
        );

        try {
          const reply = await sendMessage(text);

          waitingMessage.remove();
          addMessage(reply, 'bot');
        } catch (error) {
          console.error('Chat frontend error:', error);

          waitingMessage.remove();

          addMessage(
            'Сервис временно недоступен. Попробуйте позже.',
            'bot'
          );
        }
      });
    </script>
  </body>
</html>
